[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentally"
version = "0.1.0"
authors = [
  { name = "Aprameya Acharya" }
]
description = "Blazingly fast token counter, multi-model cost estimator, codebase packer, and CI/CD budget guardrail for OpenAI, Claude, Gemini, and DeepSeek."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "token-counter",
  "llm-cost",
  "openai",
  "gpt-4o",
  "o1",
  "o3-mini",
  "claude",
  "gemini",
  "deepseek",
  "repomix",
  "prompt-budget",
  "ci-cd-guardrail"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities"
]
dependencies = [
  "tiktoken>=0.7.0; python_version < '3.14'"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "flake8>=6.0.0",
  "twine>=4.0.0",
  "build>=1.0.0"
]

[project.scripts]
tokentally = "tokentally.cli:main"

[project.urls]
Homepage = "https://github.com/apra-acharya/tokentally"
Documentation = "https://github.com/apra-acharya/tokentally#readme"
Repository = "https://github.com/apra-acharya/tokentally.git"
Issues = "https://github.com/apra-acharya/tokentally/issues"
Changelog = "https://github.com/apra-acharya/tokentally/releases"

[tool.setuptools.packages.find]
where = ["src"]
